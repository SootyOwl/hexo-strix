[package]
name = "hexo-solver-wasm"
version = "0.1.0"
edition = "2024"
authors = ["SootyOwl"]
description = "Standalone solver-only HeXO WASM package: forced-win proving and defensive analysis without any model weights"
license = "MIT"
repository = "https://github.com/SootyOwl/hexo-strix"

[lib]
name = "hexo_solver_wasm"
crate-type = ["cdylib", "rlib"]

# Solver-only by construction: hexo-engine + hexo-solver are the only workspace
# dependencies. No hexo-infer, hexo-mcts, model weights, or network access.
[dependencies]
hexo-engine = { version = "0.1.0", path = "../hexo-engine" }
hexo-solver = { version = "0.1.0", path = "../hexo-solver" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
