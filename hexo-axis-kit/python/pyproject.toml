[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hexo-axis-models"
version = "0.1.0"
description = "Dense blocker-aware axis-line models for HeXO"
requires-python = ">=3.11"
dependencies = ["torch>=2.10", "numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hexo_axis_models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
